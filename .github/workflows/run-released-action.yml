name: Run Released LRC Action

on:
  push:
    branches:
      - use-new-runner-and-lrx-url
  workflow_dispatch:
    inputs:
      lrc_server:
        description: 'LRC URL'
        required: true
        type: string
      lrc_tenant:
        description: 'Tenant ID'
        required: true
        type: string
      lrc_project:
        description: 'Project ID'
        required: true
        default: '1'
        type: string
      lrc_test_id:
        description: 'Test ID'
        required: true
        type: string
      lrc_output_dir:
        description: 'The directory to save results'
        required: false
        default: './results'
        type: string
      lrc_report_types:
        description: 'Target report types. For example: pdf, docx, csv'
        required: false
        default: ''
        type: string

jobs:
  run_test:
    name: Start a load test
    runs-on: ubuntu-latest
    outputs:
      lrc_run_id: ${{ steps.lrc_run_test.outputs.lrc_run_id }}
    steps:
      - name: Run test in LoadRunner Cloud
        uses: MicroFocus/lrc-gh-action@v1
        id: lrc_run_test
        env:
          LRC_CLIENT_ID: ${{ secrets.LRC_CLIENT_ID }}
          LRC_CLIENT_SECRET: ${{ secrets.LRC_CLIENT_SECRET }}
        with:
          lrc_server: ${{ inputs.lrc_server || vars.LRC_URL_NIR_QA1 }}
          lrc_tenant: ${{ inputs.lrc_tenant || vars.LRC_TENANT_NIR_594775915 }}
          lrc_project: ${{ inputs.lrc_project || vars.LRC_PROJECT || '1' }}
          lrc_test_id: ${{ inputs.lrc_test_id || vars.LRC_TEST_ID }}
          lrc_output_dir: ${{ inputs.lrc_output_dir || vars.LRC_OUTPUT_DIR || './results' }}
          lrc_report_types: ${{ inputs.lrc_report_types || vars.LRC_REPORT_TYPES }}
      - name: Print test run ID
        if: ${{ always() }}
        run: echo "LRC Run ID is ${{ steps.lrc_run_test.outputs.lrc_run_id }}"
      - name: Upload LRC results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lrc-report-${{ steps.lrc_run_test.outputs.lrc_run_id }}
          path: ${{ inputs.lrc_output_dir || vars.LRC_OUTPUT_DIR || './results' }}

